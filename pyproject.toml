[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drive-qa"
version = "0.1.0"
description = "Natural-language to SQL question answering over the DRIVE drug repurposing database."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.74",
    "openai>=1.0",
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
